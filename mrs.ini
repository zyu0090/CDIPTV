[custom]
; ==============================================================================
; Lite_cn 风格订阅转换配置 (OpenClash Meta / Mihomo 专用)
; - 规则集: 保持 666OS .mrs 规则集
; - 专属分流: 整合 CDIPTV 的 micu.hk 规则与策略组
; - 地区节点: 采用 CDIPTV 简洁正则 (无韩国，包含欧洲)
; ==============================================================================

; ------------------------------------------------------------------------------
; 1. 规则集配置 (按照从上到下顺序匹配)
; ------------------------------------------------------------------------------

; [私有与本地网络]
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Private.mrs,86400
ruleset=DIRECT,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/Private.mrs,86400|no-resolve

; [新增 micu.hk 专属规则 (优先匹配)]
ruleset=🌐 MICU,[]DOMAIN-SUFFIX,micu.hk

; [即时通讯]
ruleset=即时通讯,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/TM.mrs,86400
ruleset=即时通讯,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Telegram.mrs,86400
ruleset=即时通讯,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/Telegram.mrs,86400|no-resolve

; [社交平台]
ruleset=社交平台,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/SocialMedia.mrs,86400
ruleset=社交平台,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/SocialMedia.mrs,86400|no-resolve

; [人工智能]
ruleset=人工智能,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/AI.mrs,86400
ruleset=人工智能,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/AI.mrs,86400|no-resolve

; [开发服务]
ruleset=开发服务,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Dev.mrs,86400

; [国际媒体]
ruleset=国际媒体,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Streaming.mrs,86400
ruleset=国际媒体,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/Streaming.mrs,86400|no-resolve

; [谷歌与平台服务]
ruleset=谷歌服务,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Google.mrs,86400
ruleset=谷歌服务,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/Google.mrs,86400|no-resolve
ruleset=苹果服务,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Apple.mrs,86400

; [国外流量兜底]
ruleset=国外流量,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/Proxy.mrs,86400
ruleset=国外流量,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/Proxy.mrs,86400|no-resolve

; [国内流量直连]
ruleset=国内流量,clash-domain:https://raw.githubusercontent.com/666OS/rules/release/mihomo/domain/China.mrs,86400
ruleset=国内流量,clash-ipcidr:https://raw.githubusercontent.com/666OS/rules/release/mihomo/ip/China.mrs,86400|no-resolve

; [漏网之鱼兜底]
ruleset=漏网之鱼,[]FINAL

; ------------------------------------------------------------------------------
; 2. 策略组设置
; ------------------------------------------------------------------------------

; --- 业务分流组 ---
custom_proxy_group=🌐 MICU`select`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=即时通讯`select`[]🇸🇬 新加坡节点`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=社交平台`select`[]🇺🇸 美国节点`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=人工智能`select`[]🇺🇸 美国节点`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=开发服务`select`[]🇺🇸 美国节点`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=国际媒体`select`[]🇺🇸 美国节点`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=谷歌服务`select`[]🇺🇸 美国节点`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=苹果服务`select`[]DIRECT`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点
custom_proxy_group=国外流量`select`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=国内流量`select`[]DIRECT`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点
custom_proxy_group=漏网之鱼`select`[]故障转移`[]🚀 手动选择`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点`[]DIRECT

; --- 自动故障转移 (Fallback 组) ---
custom_proxy_group=故障转移`fallback`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇼🇸 台湾节点`[]🇪🇺 欧洲节点`https://www.gstatic.com/generate_204`300,,50

; --- 全局手动选择 ---
custom_proxy_group=🚀 手动选择`select`.*

; --- 地区自动测速策略组 (完全匹配 CDIPTV 正则) ---
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|^深港专线[0-9]*\[)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇼🇸 台湾节点`url-test`(台湾)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|沪日)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美国)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇪🇺 欧洲节点`url-test`(德国|英国|法国)`https://www.gstatic.com/generate_204`300,,50

; ------------------------------------------------------------------------------
; 3. 基础参数
; ------------------------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true

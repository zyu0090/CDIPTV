[custom]
; =====================================================================
; 一、 规则集配置 (ruleset)
; 注意：Loyalsoldier 规则集为 YAML payload 格式，必须带 clash-domain: 或 clash-ipcidr: 前缀！
; =====================================================================

; >>> 1. 【你的自定义规则挂载区】（最高优先级，按需取消注释并替换链接） <<<
; ruleset=🚀 节点选择,https://gist.githubusercontent.com/你的用户名/xxx/raw/my_proxy.list
; ruleset=🎯 全球直连,https://gist.githubusercontent.com/你的用户名/xxx/raw/my_direct.list

; >>> 2. 广告拦截与隐私保护 (Loyalsoldier) <<<
ruleset=🛑 广告拦截,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt

; >>> 3. 局域网与私有网络直连 (Loyalsoldier) <<<
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
ruleset=🎯 全球直连,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt

; >>> 4. AI 服务专属分流 (OpenAI / Claude / Gemini) <<<
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

; >>> 5. 细分常用服务 (YouTube / Spotify / GitHub / AppleID / Microsoft / Google / Telegram) <<<
; YouTube（必须在 Google 之前，否则会被 Google 规则截获）
ruleset=📺 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list

; Spotify
ruleset=🎵 Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

; GitHub
ruleset=🐙 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; AppleID（仅账号登录认证分流，其余苹果服务自动走下方直连规则）
ruleset=🆔 AppleID,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleID/AppleID.list

; 微软服务
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list

; Google 服务 (Loyalsoldier)
ruleset=🇬 Google,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt

; Telegram (Loyalsoldier 官方维护的 Telegram IP 段)
ruleset=📲 Telegram,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt

; >>> 6. 核心代理与国内直连基底 (Loyalsoldier 核心规则) <<<
; gfw 列表 + proxy 列表确保被墙及常用境外网站走代理
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt

; 国内域名 + 国内 IP 段直连
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
ruleset=🎯 全球直连,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
ruleset=🎯 全球直连,[]GEOIP,CN

; >>> 7. 兜底规则 <<<
ruleset=🐟 漏网之鱼,[]FINAL


; =====================================================================
; 二、 策略组定义 (custom_proxy_group)
; =====================================================================

; 1. 核心总控组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 2. 细分应用策略组
custom_proxy_group=🤖 AI服务`select`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇹🇼 台湾节点`[]🚀 节点选择`.*
custom_proxy_group=📺 YouTube`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`.*
custom_proxy_group=🎵 Spotify`select`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]DIRECT`.*
custom_proxy_group=🐙 GitHub`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]DIRECT`.*
custom_proxy_group=🇬 Google`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`.*
custom_proxy_group=📲 Telegram`select`[]🚀 节点选择`[]🇸🇬 狮城节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`.*

; 3. AppleID 与微软服务
custom_proxy_group=🆔 AppleID`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]🇺🇲 美国节点`[]🇭🇰 香港节点

; 4. 基础分流组
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择


; =====================================================================
; 三、 地区节点自动筛选组
; =====================================================================
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(台|新北|彰化|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.gstatic.com/generate_204`300,,50


; =====================================================================
; 四、 全局行为设置
; =====================================================================
enable_rule_generator=true
overwrite_original_rules=true
emoji_rules=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Emoji.list
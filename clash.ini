[custom]
; 1. 排除广告与到期提醒节点（对应原脚本 DIRTY 正则）
exclude_remarks=(剩余流量|到期|过期|套餐|官网|重置|订阅|购买|续费|客服|通知|频道|群组|Traffic|Expire|Premium|Official|Renew|Website)

; 2. 规则集配置（对应原脚本 rule-providers 与 rules 顺序）
; 格式：ruleset=策略组名,规则集链接（或 [] 内建规则）

; --- 局域网与私有地址 ---
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.list
ruleset=DIRECT,[]GEOIP,LAN

; --- AI 服务 ---
ruleset=AI,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OpenAI/OpenAI.list
ruleset=AI,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Claude/Claude.list
ruleset=AI,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Gemini/Gemini.list

; --- 常用海外服务 ---
ruleset=YouTube,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/YouTube/YouTube.list
ruleset=Spotify,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Spotify/Spotify.list
ruleset=GitHub,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/GitHub/GitHub.list
ruleset=AppleID,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/AppleID/AppleID.list
ruleset=Microsoft,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Microsoft/Microsoft.list

; --- Google 与 Telegram ---
ruleset=Google,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.list
ruleset=Google,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/google.list
ruleset=Telegram,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.list
ruleset=Telegram,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.list

; --- 国内直连与境外兜底 ---
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.list
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.list
ruleset=Proxy,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.list

; --- 最终兜底 ---
ruleset=DIRECT,[]GEOIP,CN
ruleset=Final,[]FINAL

; 3. 策略组定义（对应原脚本 proxy-groups 与地区过滤正则）
; 格式：custom_proxy_group=组名`类型`节点/正则`测速URL`间隔,,容差

custom_proxy_group=Proxy`select`[]HK`[]TW`[]JP`[]SG`[]US`.*
custom_proxy_group=AI`select`[]JP`[]SG`[]US`[]TW`[]Proxy`.*
custom_proxy_group=YouTube`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US`.*
custom_proxy_group=Spotify`select`[]Proxy`[]US`[]HK`[]JP`[]SG`.*
custom_proxy_group=GitHub`select`[]Proxy`[]HK`[]JP`[]SG`[]US`.*
custom_proxy_group=Google`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US`.*
custom_proxy_group=Telegram`select`[]Proxy`[]SG`[]HK`[]JP`[]US`.*
custom_proxy_group=AppleID`select`[]DIRECT`[]Proxy`[]US`[]HK`[]JP`.*
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxy`[]US`[]HK`.*
custom_proxy_group=Final`select`[]Proxy`.*

; --- 地区自动测速组（严格对齐原脚本的非字母边界正则） ---
custom_proxy_group=HK`url-test`(香港|港|HKG|Hong ?Kong|(^|[^a-zA-Z])HK([^a-zA-Z]|$))`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=TW`url-test`(台湾|台灣|台北|新北|台中|台南|高雄|彰化|新竹|桃园|Taiwan|(^|[^a-zA-Z])(TW|CHT)([^a-zA-Z]|$))`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`url-test`(日本|东京|東京|大阪|埼玉|札幌|名古屋|(川|泉|沪|深|广|苏|杭)日|Japan|(^|[^a-zA-Z])(JP|JPN)([^a-zA-Z]|$))`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG`url-test`(新加坡|狮城|坡|Singapore|(^|[^a-zA-Z])(SG|SGP)([^a-zA-Z]|$))`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=US`url-test`(美国|美西|美东|美中|美区|洛杉矶|硅谷|圣何塞|西雅图|波特兰|俄勒冈|达拉斯|凤凰城|拉斯维加斯|纽约|芝加哥|迈阿密|阿什本|United ?States|(^|[^a-zA-Z])(US|USA|LAX|SJC|SEA|NYC)([^a-zA-Z]|$))`https://www.gstatic.com/generate_204`300,,50

; 4. 基础开关
enable_rule_generator=true
overwrite_original_rules=true

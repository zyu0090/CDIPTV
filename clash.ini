[custom]
; ------------------------------------------------------------------
; 1. 节点清洗(对应 clash.js 的 dirtyFilter 正则)
;    过滤机场的流量/到期/官网等垃圾节点,避免刷进策略组
; ------------------------------------------------------------------
exclude_remarks=(GB|gb|Traffic|traffic|TRAFFIC|Expire|expire|Expired|expired|Premium|premium|频道|订阅|ISP|isp|流量|到期|过期|重置|官网|群|通知|剩余|套餐|续费|客服|购买|官网|网址)
; ------------------------------------------------------------------
; 2. 分流规则(顺序与 clash.js 的 rules 一致: lua 从上往下优先命中)
;    格式: ruleset=策略组,[]类型,参数[,no-resolve]
; ------------------------------------------------------------------
; --- 局域网 / 私有地址 -> DIRECT ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve
; --- AI 服务 -> AI ---
ruleset=AI,[]GEOSITE,openai
ruleset=AI,[]GEOSITE,anthropic
ruleset=AI,[]GEOSITE,google-gemini
; --- 细分媒体 / 服务 ---
ruleset=YouTube,[]GEOSITE,youtube
ruleset=Spotify,[]GEOSITE,spotify
ruleset=GitHub,[]GEOSITE,github
ruleset=AppleID,[]GEOSITE,apple
ruleset=Microsoft,[]GEOSITE,microsoft
; --- Google / Telegram: 域名 + IP 双段 ---
ruleset=Google,[]GEOSITE,google
ruleset=Google,[]GEOIP,google,no-resolve
ruleset=Telegram,[]GEOSITE,telegram
ruleset=Telegram,[]GEOIP,telegram,no-resolve
; --- 境外常用域名 -> Proxy ---
ruleset=Proxy,[]GEOSITE,geolocation-!cn
; --- 国内域名 / 国内 IP -> DIRECT ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve
; --- 兜底 -> Final ---
ruleset=Final,[]FINAL
; ------------------------------------------------------------------
; 3. 策略组(对应 clash.js 的 proxy-groups)
;    select 组顺序 = 原脚本的优先顺序,末尾 .* 追加全部节点(自动去重)
; ------------------------------------------------------------------
custom_proxy_group=Proxy`select`[]HK`[]TW`[]JP`[]SG`[]US`.*
custom_proxy_group=AI`select`[]JP`[]SG`[]US`[]TW`[]Proxy`.*
custom_proxy_group=YouTube`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US`.*
custom_proxy_group=Spotify`select`[]Proxy`[]US`[]HK`[]JP`[]SG`.*
custom_proxy_group=GitHub`select`[]Proxy`[]HK`[]JP`[]SG`[]US`.*
custom_proxy_group=Google`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US`.*
custom_proxy_group=Telegram`select`[]Proxy`[]SG`[]HK`[]JP`[]US`.*
custom_proxy_group=AppleID`select`[]DIRECT`[]Proxy`[]US`[]HK`[]JP`.*
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxy`[]US`[]HK`.*
custom_proxy_group=Final`select`[]Proxy`.*
; ------------------------------------------------------------------
; 4. 地区自动测速组(对应 clash.js 的 HK/TW/JP/SG/US url-test)
;    格式: 组名`url-test`(正则)`测速地址`间隔,,容差
;    正则由转换器在服务端展开成真实节点名,不提给 mihomo,故可用 PCRE 语法
;    无匹配节点时转换器会自动塞入 DIRECT,不会生成空组
; ------------------------------------------------------------------
custom_proxy_group=HK`url-test`(香港|港|HK|HKG|Hong ?Kong|九龙|新界|沙田|荃湾|葵涌|将军澳)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=TW`url-test`(台湾|台灣|台北|新北|桃园|新竹|台中|台南|高雄|彰化|TW|Taiwan|TPE)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`url-test`(日本|东京|東京|大阪|埼玉|札幌|名古屋|川日|泉日|沪日|深日|广日|苏日|JP|Japan|JPN|NRT|HND|KIX)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG`url-test`(新加坡|狮城|SG|Singapore|SIN)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=US`url-test`(美国|美西|美东|美中|美区|洛杉矶|硅谷|圣何塞|圣克拉拉|西雅图|波特兰|俄勒冈|达拉斯|凤凰城|拉斯维加斯|纽约|芝加哥|迈阿密|阿什本|US|USA|United ?States|LAX|SJC|SEA|NYC)`http://www.gstatic.com/generate_204`300,,50
; ------------------------------------------------------------------
; 5. 开关
; ------------------------------------------------------------------
enable_rule_generator=true
overwrite_original_rules=true

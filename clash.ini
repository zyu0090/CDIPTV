[custom]
; 1. 排除无用/广告/到期信息节点
exclude_remarks=(剩余流量|到期|过期|套餐|官网|重置|订阅|购买|续费|客服|通知|频道|群组|Traffic|Expire|Premium|Official|Renew|Website)

; 2. 基础开关
enable_rule_generator=true
overwrite_original_rules=true

; 3. 策略组定义
custom_proxy_group=Proxy`select`[]HK`[]TW`[]JP`[]SG`[]US`[]DIRECT
custom_proxy_group=AI`select`[]JP`[]SG`[]US`[]TW`[]Proxy
custom_proxy_group=YouTube`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US
custom_proxy_group=Spotify`select`[]Proxy`[]US`[]HK`[]JP`[]SG
custom_proxy_group=GitHub`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US`[]DIRECT
custom_proxy_group=Google`select`[]Proxy`[]HK`[]TW`[]JP`[]SG`[]US
custom_proxy_group=Telegram`select`[]Proxy`[]SG`[]HK`[]JP`[]US
custom_proxy_group=AppleID`select`[]DIRECT`[]Proxy`[]US`[]HK`[]JP
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxy`[]US`[]HK
custom_proxy_group=Final`select`[]Proxy`[]DIRECT

; --- 地区自动测速组 ---
custom_proxy_group=HK`url-test`(香港|港|HKG|Hong\s?Kong|(?i)\bhk\b)`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=TW`url-test`(台湾|台灣|台北|新北|台中|台南|高雄|彰化|新竹|桃园|Taiwan|(?i)\b(tw|cht)\b)`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=JP`url-test`(日本|东京|東京|大阪|埼玉|札幌|名古屋|Japan|(?i)\b(jp|jpn)\b)`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=SG`url-test`(新加坡|狮城|坡|Singapore|(?i)\b(sg|sgp)\b)`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=US`url-test`(美国|美西|美东|美中|美区|洛杉矶|硅谷|圣何塞|西雅图|波特兰|俄勒冈|达拉斯|凤凰城|拉斯维加斯|纽约|芝加哥|迈阿密|阿什本|United\s?States|(?i)\b(us|usa|lax|sjc|sea|nyc)\b)`https://www.gstatic.com/generate_204`300,,100

; 4. 规则集配置（严格匹配 Fake-IP：域名规则全部靠前，IP 规则全部带 no-resolve）

; --- 局域网与私有网络（防止内网设备被劫持） ---
ruleset=DIRECT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.list
ruleset=DIRECT,[]GEOIP,LAN,no-resolve
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 常见海外服务（域名优先判定，直接走代理，绝不解析真实 IP） ---
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
ruleset=GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=AppleID,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleID/AppleID.list
ruleset=Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list

; --- Google & Telegram（域名与带 no-resolve 的 IP 分流） ---
ruleset=Google,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.list
ruleset=Google,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.list,no-resolve
ruleset=Telegram,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.list
ruleset=Telegram,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.list,no-resolve

; --- 国内域名直连与境外域名兜底（Fake-IP 下的核心：靠域名搞定绝大部分分流） ---
ruleset=DIRECT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.list
ruleset=Proxy,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.list

; --- IP 兜底规则（必须加 no-resolve 避免多余的解析开销） ---
ruleset=DIRECT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.list,no-resolve
ruleset=DIRECT,[]GEOIP,CN,no-resolve

; --- 最终兜底 ---
ruleset=Final,[]MATCH
